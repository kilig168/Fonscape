# Fonscape 博客 Pages CMS 配置
# 放置位置：仓库根目录的 .pages.yml

media:
  input: public/assets
  output: /assets

content:
  # ==================== 文章 ====================
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "posts-{year}-{month}{day}-{hour}{minute}.md"
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: category
        label: 分类
        type: select
        required: true
        options:
          values:
            - 技术
            - 阅读
            - 生活
            - 创作
            - 观察
            - 学习
            - 技能

      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true

      - name: slug
        label: Slug（自定义地址）
        type: string
        default: ''
        description: "默认取文件名，留空则不覆盖。只能使用小写字母、数字、/、_、-"

      - name: excerpt
        label: 摘要
        type: text
        description: "列表与详情页摘要，未填写时会尝试读取正文首段"
        options:
          rows: 3

      - name: tags
        label: 标签
        type: string
        default: '["测试"]'
        description: '必须写成 JSON 数组，例如：["测试", "文章"]。留空则不写该字段。'

      - name: series
        label: 系列名称
        type: string
        default: ''
        description: "同系列文章会在详情页显示上一章/下一章"

      - name: seriesOrder
        label: 系列内顺序
        type: number
        default: ''
        description: "建议填写互不重复的编号"

      - name: featured
        label: 置顶
        type: boolean
        default: false

      - name: featuredOrder
        label: 置顶顺序
        type: number
        description: "仅当置顶为 true 时使用，正整数，从小到大排序"

      - name: body
        label: 正文
        type: rich-text

      - name: image
        label: 封面图片
        type: string
        default: ''
        description: "填写图床图片链接，例如：https://img.example.com/图片.jpg"

      - name: cardPosition
        label: 卡片图片焦点位置
        type: string
        description: '按“水平 垂直”填写，例如：50% 30%'

      - name: coverMode
        label: 详情页封面模式
        type: select
        options:
          values:
            - wide
            - none

      - name: music
        label: 文章配乐
        type: object
        description: "可选，JSON 对象"
        fields:
          - name: src
            label: 音频路径
            type: string
          - name: cover
            label: 封面路径
            type: string
            default: ''
            description: "填写图床图片链接，例如：https://img.example.com/cover.jpg"
          - name: title
            label: 曲名
            type: string
          - name: artist
            label: 音乐人
            type: string

      - name: musicPlacement
        label: 配乐位置
        type: select
        description: "inline 时由正文标记决定位置"
        options:
          values:
            - inline


  # ==================== 小诗 ====================
  - name: poems
    label: 小诗
    type: collection
    path: src/content/poems
    format: yaml-frontmatter
    filename: "poems-{year}-{month}{day}-{hour}{minute}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true

      - name: slug
        label: Slug（自定义地址）
        type: string
        default: ''
        description: "默认取文件名，留空则不覆盖。只能使用小写字母、数字、/、_、-"

      - name: note
        label: 附注
        type: text
        description: "可选，显示在诗正文之后"
        options:
          rows: 3

      - name: body
        label: 诗正文
        type: text
        description: "按行显示，空行也会保留"
        options:
          rows: 10

  # ==================== 音乐手记 ====================
  - name: music
    label: 音乐手记
    type: collection
    path: src/content/music
    format: yaml-frontmatter
    filename: "music-{year}-{month}{day}-{hour}{minute}.md"
    view:
      fields: [title, kind, section, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: kind
        label: 内容类型
        type: string
        required: true
        description: "例如：歌曲、音乐人、专辑"

      - name: date
        label: 日期
        type: date
        required: true
        options:
          time: true

      - name: section
        label: 板块
        type: select
        description: "未填写时默认为 songs"
        options:
          values:
            - songs
            - artists
            - albums

      - name: slug
        label: Slug（自定义地址）
        type: string
        default: ''
        description: "默认取文件名，留空则不覆盖。只能使用小写字母、数字、/、_、-"

      - name: excerpt
        label: 摘要
        type: text
        options:
          rows: 3

      - name: image
        label: 封面图片
        type: string
        default: ''
        description: "填写图床图片链接，例如：https://img.example.com/cover.jpg"

      - name: body
        label: 正文
        type: rich-text

      - name: url
        label: 外部地址
        type: string
        description: "收听或资料链接"

      - name: action
        label: 跳转按钮文字
        type: string
        description: '默认“前往收听”'

      - name: sourceTitle
        label: 外部来源标题
        type: string
        description: "默认使用手记标题"

      - name: sourceMeta
        label: 外部来源副标题
        type: string
        description: "默认使用 kind 字段"


  # ==================== 友链 ====================
  - name: friends
    label: 友链
    type: file
    path: src/content/friends.json
    format: json
    fields:
      - name: items
        label: 友链列表
        type: object
        list: true
        fields:
          - name: name
            label: 站点名称
            type: string
            required: true

          - name: url
            label: 站点地址
            type: string
            required: true
            pattern: "^https?://"

          - name: description
            label: 站点简介
            type: string

          - name: owner
            label: 站长名称
            type: string

          - name: avatar
            label: 头像
            type: string
            default: ''
            description: "填写图床图片链接，例如：https://img.example.com/cover.jpg"

          - name: userId
            label: 账户用户 ID
            type: string
            description: "可选，填写后头像与昵称从站点账户同步"

          - name: color
            label: 主题色
            type: string
            description: "例如 #d98ab0"
